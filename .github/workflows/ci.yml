name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag exists past v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe lint

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag exists past v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe types

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag exists past v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe unit

  # The evaluation harness is a gate rather than a test: it scores committed golden sets against the
  # build and refuses a capability that degrades by more than two points against the tag's baseline,
  # or a citation validity under its absolute floor. The committed sets are placeholders in v0.1, so
  # this job's teeth are its last step: the fixture material is scored at the quality its baseline
  # records, then again with the regressed answers installed over it, and the gate has to refuse the
  # second one. A gate that refused everything would fail the step before it.
  evaluation:
    name: evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag exists past v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked

      # The committed sets, against the release tag's own baseline, under the declared rules.
      - name: Score the committed golden sets
        run: uv run poe eval

      # The harness's own exercise set, as the build its baseline was recorded from.
      - name: Score the fixture material against its recorded baseline
        run: uv run poe eval-fixtures

      # A regression injected into the fixtures: the same cases, answered worse than the baseline
      # records. The step fails unless the gate refuses the run, which is what "a regression injected
      # into the fixtures trips the CI job" means on every pull request rather than in prose. Exit `1`
      # exactly: `1` is a declared rule firing, `2` is a run that could not be made, and accepting any
      # non-zero would let a run that never printed a table pass for a gate that bit.
      - name: Inject a regression into the fixtures and require the gate to refuse it
        run: |
          cp --recursive evaluation/fixtures /tmp/regressed
          cp /tmp/regressed/regressed/*.jsonl /tmp/regressed/predictions/
          status=0
          uv run claim-triage-eval \
              --sets /tmp/regressed/golden \
              --predictions /tmp/regressed/predictions \
              --baseline /tmp/regressed/baseline.json > /tmp/regressed/table.txt || status=$?
          cat /tmp/regressed/table.txt
          if [ "$status" -ne 1 ]; then
            echo "::error::the evaluation gate answered $status; 1 is a declared rule firing, 2 is a run that could not be made"
            exit 1
          fi

  # Postgres is what both of these jobs' tests need, and neither is a unit test: the contract job
  # drives a generated client against a running service, and the audit transaction is a property of
  # the database rather than of the code that asks for one.
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag exists past v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked

      # The contract package is committed, so regenerating it must change nothing. `git status` rather
      # than a diff alone, because a file the generator stopped writing shows up as untracked. Why it
      # is committed at all is in docs/adr/0004.
      - name: Regenerate the contract package from the contract
        run: |
          uv run poe generate
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo '::error::src/claim_triage/contract is not what contracts/core-sim.openapi.yaml generates'
            git --no-pager diff
            exit 1
          fi

      # Postgres is the one piece of the stack these tests need: they start the service themselves, on
      # a port of their own and over the real store, so a stale process cannot pass for a live one.
      - name: Start Postgres
        run: docker compose up --detach --wait postgres

      - name: Drive the generated client against the running service
        run: uv run poe contract

      # Same Postgres, same job: the state change and its audit entry are one transaction, and that
      # is only convincing where the transaction is real.
      - name: Prove the audit transaction against Postgres
        run: uv run poe postgres

      - name: Report the stack's logs if the run failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Postgres
        if: always()
        run: docker compose down --volumes

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rootful Podman, because rootless Podman in a hosted runner is not something to bet a job on
      # (docs/adr/0003); the runner image ships it. `--squash-all` flattens the image to the runtime
      # filesystem, so what the build deleted — the download cache, pip, ensurepip — is not retained
      # in an underlying layer and cannot be found by a scanner or extracted from the artefact. The
      # tag is the one compose.yaml names, so the loaded image is the image the stack asks for.
      - name: Build the image with Podman
        run: |
          sudo podman build \
            --squash-all \
            --tag localhost/claim-triage-agent:dev \
            --file Containerfile \
            .

      - name: Export the image for scanning and for the stack
        run: |
          sudo podman save \
            --format docker-archive \
            --output /tmp/claim-triage-agent.tar \
            localhost/claim-triage-agent:dev

      # Trivy runs as a container, not through trivy-action: that action ignores `input` and would
      # scan a path instead of this tar (aquasecurity/trivy-action v0.36.0, entrypoint.sh).
      # `--ignore-unfixed` keeps the gate on findings this repository can act on: an unfixed CVE in a
      # base image is not something a change here can fix, and gating on it would only teach people
      # to bypass the gate. It is still printed, so it stays visible.
      - name: Scan the image
        run: |
          docker run --rm --volume /tmp:/scan:ro docker.io/aquasec/trivy:0.74.0 image \
            --input /scan/claim-triage-agent.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      # The same compose.yaml the developer runs, with the image Podman built: `up --no-build` keeps
      # the runner's Docker from rebuilding it and hiding a broken Podman build, and `run` reuses the
      # image the load just installed. The job reports success only once `claim-triage-smoke` has
      # carried one claim through the running stack.
      - name: Start the stack and process one claim end to end
        run: |
          docker load --input /tmp/claim-triage-agent.tar
          docker compose up --detach --wait --wait-timeout 300 --no-build
          docker compose --profile smoke run --rm smoke

      - name: Report the stack's logs if the run failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
