[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claim-triage-agent"
version = "0.1.0"
description = "Motor-claim triage agent for Slovak motor insurance: document extraction, edition-aware retrieval, classification, routing and decision support."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116",
    "httpx2>=2.13.1",
    "langgraph>=1.2.12",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.35",
]

[project.scripts]
claim-triage-api = "claim_triage.services.api:main"
claim-triage-triager = "claim_triage.services.triager:main"
claim-triage-extraction = "claim_triage.services.extraction:main"
claim-triage-retrieval = "claim_triage.services.retrieval:main"
claim-triage-guardrail-policy = "claim_triage.services.guardrail_policy:main"
claim-triage-reviewer-ui = "claim_triage.services.reviewer_ui:main"
claim-triage-core-sim = "claim_triage.services.core_sim:main"
# Not a deployable: drives one claim through a running stack (see the container section of README.md).
claim-triage-smoke = "claim_triage.smoke:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "poethepoet>=0.30",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/claim_triage"]

[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check ." }
types = "mypy src tests"
unit = "pytest"
# The contract tests need a running service and a real Postgres; the unit job must not collect them.
contract = "pytest -m contract"
# The audit transaction is a property of the database, so these need the same Postgres and nothing else.
postgres = "pytest -m postgres"
# The provider adapter is never exercised in CI (ticket 05): these drive it against a socket the
# tests serve, and are asked for here rather than by the unit job.
provider = "pytest -m provider"
# The contract package is generated from contracts/core-sim.openapi.yaml, and committed.
generate = "python -m claim_triage.codegen"
check = ["lint", "types", "unit"]
format = { shell = "ruff check --fix . && ruff format ." }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
# Two `conftest` modules, one per test directory: deriving module names from these bases keeps them
# distinct instead of reporting a duplicate module. `tests` is on the path because the modules beside
# a test import each other by bare name (`support`).
explicit_package_bases = true
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML ships no type information; the generator and the contract tests read documents through it.
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The contract tests drive a running service and a real Postgres, so the default run leaves them out
# and `poe contract` is what asks for them. The provider tests drive the provider adapter, which
# ticket 05 keeps out of CI entirely, so `poe provider` is what asks for those.
addopts = "-q -m 'not contract and not postgres and not provider'"
markers = [
    "contract: drives the generated client against a running core-sim (poe contract)",
    "postgres: needs the stack's Postgres, and nothing else (poe postgres)",
    "provider: drives the provider adapter against a loopback socket (poe provider)",
]
